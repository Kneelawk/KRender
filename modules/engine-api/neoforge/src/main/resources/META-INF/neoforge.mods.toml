modLoader = "javafml"
loaderVersion = "[1,)"
license = "${license}"

[[mixins]]
config = "krender_engine_api.xplat.mixins.json"

[[mixins]]
config = "krender_engine_api.neoforge.mixins.json"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${name}"
authors = "${authors_neoforge}"
description = "${description}"
logoFile = "assets/${mod_id}/icon.png"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "REQUIRED"
versionRange = "${loader_version_neoforge}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "common_events"
type = "REQUIRED"
versionRange = "${common_events_version_neoforge}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "krender_reload_listener"
type = "REQUIRED"
versionRange = "*"
ordering = "NONE"
side = "BOTH"
